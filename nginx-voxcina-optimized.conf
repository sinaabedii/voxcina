# Optimized Nginx Configuration for Voxcina
# This config adds image caching and direct serving to improve performance

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name voxcina.com www.voxcina.com;
    return 301 https://$host$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    server_name voxcina.com www.voxcina.com;
    
    ssl_certificate /etc/letsencrypt/live/voxcina.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voxcina.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;
    gzip_comp_level 6;

    # Client body size (for uploads)
    client_max_body_size 50M;

    # Serve static uploads directly from filesystem (FASTEST)
    location /uploads/ {
        alias /root/voxcina/uploads/;
        
        # Aggressive caching for images
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Served-By "nginx-direct";
        
        # Enable sendfile for better performance
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        
        # CORS headers if needed
        add_header Access-Control-Allow-Origin "*";
        
        # Disable access logs for static files (performance)
        access_log off;
        
        # Try file, return 404 if not found
        try_files $uri =404;
    }

    # API requests go to backend
    location /api/ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Disable buffering for API responses
        proxy_buffering off;
    }

    # Virtual Try-On (VITON) service - proxied via SSH tunnel to GPU server
    location /viton/ {
        proxy_pass http://127.0.0.1:5010/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_max_body_size 50M;
    }

    # All other requests go to Next.js frontend
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
