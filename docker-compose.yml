# ┌──────────────────────────────────────────────────────────────────┐
# │ docker-compose.yml                                              │
# └──────────────────────────────────────────────────────────────────┘
version: '3.8'

services:
  server:
    build:
      context: .
      # use host networking for the build step so DNS resolution works
      network: host
    container_name: api-server
    ports:
      - "8080:8080"
    environment:
      - MONGODB_URI=mongodb://admin:password@mongo:27017
      - JWT_SECRET=137888
      - SERVER_PORT=8080
      - RUN_TESTS=false
    depends_on:
      - mongo
    networks:
      - backend-network

  mongo:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - mongodb-data:/data/db
    networks:
      - backend-network

  # Test service that runs when RUN_TESTS=true
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: api-test
    environment:
      - MONGODB_URI=mongodb://admin:password@mongo:27017
      - JWT_SECRET=137888
      - API_URL=http://server:8080/api
      - RUN_TESTS=true
    depends_on:
      - mongo
      - server
    networks:
      - backend-network

volumes:
  mongodb-data:

networks:
  backend-network:
    driver: bridge
