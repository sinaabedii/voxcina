# ┌──────────────────────────────────────────────────────────────────┐
# │ docker-compose.yml                                              │
# └──────────────────────────────────────────────────────────────────┘
services:
  server:
    build:
      context: .
      # use host networking for the build step so DNS resolution works
      network: host
    container_name: api-server
    ports:
      - "8080:8080"
    environment:
      - MONGODB_URI=mongodb://admin:password@mongo:27017/admin?authSource=admin
      - JWT_SECRET=137888
      - SERVER_PORT=8080
      - RUN_TESTS=false
      # - DEBUG=true
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - backend-network

  mongo:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    volumes:
      - mongodb-data:/data/db
    networks:
      - backend-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh mongodb://admin:password@localhost:27017/admin?authSource=admin --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Test service that runs when RUN_TESTS=true
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: api-test
    environment:
      - MONGODB_URI=mongodb://admin:password@mongo:27017/admin?authSource=admin
      - JWT_SECRET=137888
      - API_URL=http://server:8080/api
      - RUN_TESTS=true
    depends_on:
      server:
        condition: service_started
      mongo:
        condition: service_healthy
    networks:
      - backend-network

  front_end:
    container_name: voxcina_frontend
    build:
      context: ./front_end
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - GO_BACKEND_URL=http://server:8080
      - NEXT_PUBLIC_API_URL=https://www.voxina.com
      - NEXT_PUBLIC_IS_PRODUCTION=${IS_PRODUCTION:-false}
    volumes:
      - ./uploads:/app/public/uploads
    depends_on:
      - server
    networks:
      - backend-network

volumes:
  mongodb-data:

networks:
  backend-network:
    driver: bridge
