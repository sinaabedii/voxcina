# ┌──────────────────────────────────────────────────────────────────┐
# │ docker-compose.yml                                              │
# └──────────────────────────────────────────────────────────────────┘
services:
  server:
    build:
      context: .
      # use host networking for the build step so DNS resolution works
      network: host
    container_name: go-backend
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: "137888"
      DB_CONNECTION: "mongodb://mongo:27017/fitness"
      DB_NAME: "fitnessDB"
    depends_on:
      - mongo
    networks:
      - app-network

  mongo:
    image: mongo:latest
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

volumes:
  mongo_data:

networks:
  app-network:
    driver: bridge
