version: '3.8'

services:
  server:
    build: .
    container_name: go-backend
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET=137888
      - DB_CONNECTION=mongodb://mongo:27017/fitness
      - DB_NAME=fitnessDB
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
