version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: voxcina-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password123}
      MONGO_INITDB_DATABASE: ${DB_NAME:-voxcina}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    networks:
      - voxcina-network
    command: mongod --auth

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: voxcina-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - voxcina-network
    command: redis-server --appendonly yes

  # Voxcina Chatbot Application
  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voxcina-chatbot
    restart: unless-stopped
    environment:
      # Database Configuration
      MONGODB_URL: mongodb://admin:password123@mongodb:27017/voxcina?authSource=admin
      DB_NAME: ${DB_NAME:-voxcina}
      
      # Vector Database
      CHROMA_DB_PATH: /app/data/chroma_db
      
      # LLM Configuration
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gpt-4}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-ada-002}
      
      # WebSocket Configuration
      WS_HOST: 0.0.0.0
      WS_PORT: 8765
      
      # API Configuration
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8080/api}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key}
      
      # Redis Configuration (optional)
      REDIS_URL: redis://redis:6379/0
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
    ports:
      - "8765:8765"
    volumes:
      - chatbot_data:/app/data
      - chatbot_logs:/app/logs
    networks:
      - voxcina-network
    depends_on:
      - mongodb
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.connect(('localhost', 8765)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: voxcina-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - voxcina-network
    depends_on:
      - chatbot

  # MongoDB Express (Web UI for MongoDB - Development only)
  mongo-express:
    image: mongo-express:latest
    container_name: voxcina-mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-password123}
      ME_CONFIG_MONGODB_URL: mongodb://admin:password123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASS:-admin123}
    ports:
      - "8081:8081"
    networks:
      - voxcina-network
    depends_on:
      - mongodb
    profiles:
      - development

  # Prometheus for monitoring (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: voxcina-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - voxcina-network
    profiles:
      - monitoring

  # Grafana for dashboards (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: voxcina-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - voxcina-network
    depends_on:
      - prometheus
    profiles:
      - monitoring

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  chatbot_data:
    driver: local
  chatbot_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  voxcina-network:
    driver: bridge