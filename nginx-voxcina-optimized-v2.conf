server {
    listen 80;
    server_name www.voxcina.com;
    return 301 https://voxcina.com$request_uri;
}

server {
    listen 80;
    server_name voxcina.com;
    return 301 https://voxcina.com$request_uri;
}

server {
    listen 8443 ssl http2;
    server_name www.voxcina.com;
    ssl_certificate /etc/letsencrypt/live/voxcina.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voxcina.com/privkey.pem;
    return 301 https://voxcina.com$request_uri;
}

server {
    listen 8443 ssl http2;
    server_name voxcina.com;
    
    ssl_certificate /etc/letsencrypt/live/voxcina.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voxcina.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    
    # Gzip compression (enhanced)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    
    # Buffer optimization
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 16k;
    output_buffers 1 32k;
    postpone_output 1460;
    
    # Connection optimization
    keepalive_timeout 65;
    keepalive_requests 100;
    
    # Client body size
    client_max_body_size 50M;
    
    location /api/v2/analytics/track {
        proxy_pass http://127.0.0.1:23333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
    
    location /_next/static/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Enhanced caching for CDN
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable, stale-while-revalidate=86400";
        add_header Vary "Accept-Encoding";
        add_header CDN-Cache-Control "public, max-age=31536000";
        
        access_log off;
    }
    
    location ~* \\.(css|js|woff|woff2|ttf|svg|webp|avif|jpg|jpeg|png|gif|ico)$ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Enhanced caching for CDN
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable, stale-while-revalidate=86400";
        add_header Vary "Accept-Encoding";
        add_header CDN-Cache-Control "public, max-age=31536000";
        
        access_log off;
    }
    
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
